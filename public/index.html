<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDNS Updater Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            /* Light theme - Minimal & Clean */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --bg-input: #f8fafc;
            --log-bg: #ffffff;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-blue-subtle: #eff6ff;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --card-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        body.dark-mode {
            /* Dark Neutral Theme */
            --bg-body: #0f172a;           /* slate-900 */
            --bg-card: #1e293b;           /* slate-800 */
            --text-main: #f8fafc;         /* slate-50 */
            --text-muted: #94a3b8;        /* slate-400 */
            --border-color: #334155;      /* slate-700 */
            --bg-input: #0f172a;
            --log-bg: #1e293b;
            --accent-blue: #3b82f6;       /* Soft blue */
            --accent-blue-hover: #60a5fa;
            --accent-blue-subtle: #1e3a8a;
            --success-green: #10b981;     /* Muted green */
            --danger-red: #ef4444;        /* Soft red */
            --card-shadow: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Layout */
        .wrapper { flex: 1; min-height: 0; padding-top: 32px; display: flex; flex-direction: column; }
        .footer { flex-shrink: 0; padding: 24px 0; background: var(--bg-body); text-align: center; font-size: 0.85rem; color: var(--text-muted); }

        /* Mobile Responsiveness */
        @media (max-width: 991px) {
            body { height: auto; min-height: 100vh; overflow-y: auto; overflow-x: hidden; }
            .wrapper, .wrapper > .container, .wrapper .row, .col-lg-5, .col-lg-7 { height: auto !important; overflow: visible !important; }
            .log-container { height: 400px !important; flex: none !important; }
            .wrapper { padding-bottom: 32px; }
            #trackedDomainsList { max-height: none !important; }
        }
        
        /* Header */
        .navbar { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 16px 0; transition: background-color 0.2s ease, border-color 0.2s ease; }
        .navbar-brand { font-weight: 500; font-size: 1.1rem; display: flex; align-items: center; gap: 12px; color: var(--text-main); letter-spacing: -0.01em; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--success-green); box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
        
        /* Cards */
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: var(--card-shadow); margin-bottom: 24px; color: var(--text-main); transition: background-color 0.2s ease, border-color 0.2s ease; }
        .card-header { background: transparent; border-bottom: 1px solid var(--border-color); font-weight: 500; padding: 20px 24px; font-size: 1rem; border-top-left-radius: 12px !important; border-top-right-radius: 12px !important; }
        .card-body { padding: 24px; }
        
        /* Inputs & Selects */
        .form-control, .form-select, .input-group-text { background: var(--bg-input); color: var(--text-main); border-radius: 8px; border: 1px solid var(--border-color); box-shadow: none; padding: 10px 16px; font-size: 0.95rem; transition: all 0.2s ease; }
        .form-control:focus, .form-select:focus { background: var(--bg-input); color: var(--text-main); border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); outline: none; }
        .form-control:disabled, .form-select:disabled { opacity: 0.6; cursor: not-allowed; background: var(--bg-input); }
        .form-label { font-weight: 500; font-size: 0.8rem; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
        
        .input-group > .form-control, .input-group > .form-select { border-right: none; }
        .input-group > .btn { border-top-right-radius: 8px; border-bottom-right-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-muted); }
        .input-group > .btn:hover:not(:disabled) { background: var(--bg-input); color: var(--text-main); }
        
        /* Custom Select Arrow */
        .form-select {  
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 16px 12px;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            appearance: none;
        }

        /* Buttons */
        .btn { border-radius: 8px; padding: 10px 16px; font-weight: 500; font-size: 0.9rem; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; }
        .btn:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); outline: none; }
        .btn-primary { background-color: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .btn-primary:hover:not(:disabled) { background-color: var(--accent-blue-hover); border-color: var(--accent-blue-hover); }
        .btn-success { background-color: var(--success-green); border-color: var(--success-green); color: #fff; }
        .btn-danger { background-color: var(--danger-red); border-color: var(--danger-red); color: #fff; }
        
        .btn-outline-custom { background: transparent; border-color: var(--border-color); color: var(--text-main); }
        .btn-outline-custom:hover:not(:disabled) { background: var(--bg-input); border-color: var(--text-muted); }
        
        .btn-icon-only { padding: 8px; border-radius: 6px; background: transparent; border: 1px solid transparent; color: var(--text-muted); }
        .btn-icon-only:hover:not(:disabled) { background: var(--bg-input); border-color: var(--border-color); color: var(--text-main); }
        
        .dark-mode-toggle { cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); transition: all 0.2s ease; }
        .dark-mode-toggle:hover { background: var(--bg-card); color: var(--text-main); }
        
        /* Tracked Domains */
        #trackedDomainsList { max-height: 240px; overflow-y: auto; overflow-x: hidden; }
        .domain-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-color); background: transparent; transition: background 0.2s ease; }
        .domain-item:last-child { border-bottom: none; }
        .domain-item:hover { background: rgba(0,0,0,0.02); }
        body.dark-mode .domain-item:hover { background: rgba(255,255,255,0.02); }
        
        .domain-item.paused { opacity: 0.5; }
        .domain-meta { display: flex; gap: 8px; margin-top: 6px; }
        .badge { font-weight: 500; font-size: 0.72rem; padding: 4px 8px; border-radius: 4px; letter-spacing: 0.02em; }
        
        /* Status Badges */
        .badge-proxy-on { background-color: rgba(236, 72, 153, 0.1); color: #ec4899; }
        .badge-proxy-off { background-color: rgba(100, 116, 139, 0.1); color: #64748b; }
        .badge-interval { background-color: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
        .badge-paused { background-color: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        
        /* Logs */
        .log-container { 
            background: var(--log-bg); 
            border-radius: 12px; 
            padding: 24px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            flex: 1;
            min-height: 0;
            overflow-y: auto; 
            white-space: pre-wrap;
            line-height: 1.8;
            border: 1px solid var(--border-color);
        }
        
        .log-entry { padding: 4px 0; border-bottom: 1px solid rgba(148, 163, 184, 0.1); }
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: var(--text-muted); opacity: 0.7; font-size: 0.8rem; margin-right: 12px; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        
        /* Utilities */
        .text-main { color: var(--text-main) !important; }
        .svg-icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body class="dark-mode">

<!-- Header -->
<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="navbar-brand m-0">
            <span class="status-dot"></span>
            Cloudflare Sync
        </div>
        <div class="d-flex gap-3">
            <button class="dark-mode-toggle" id="darkModeBtn" title="Toggle Theme">
                <svg class="svg-icon" id="themeIcon" viewBox="0 0 24 24"></svg>
            </button>
            <button class="btn btn-outline-custom" id="restartBtn" title="Reboot System">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18.36 6.64A9 9 0 0 1 20 13a9 9 0 1 1-3-7.7L16 6"/><path d="M16 2v4h-4"/></svg>
                <span class="d-none d-sm-inline">Reboot</span>
            </button>
        </div>
    </div>
</nav>

<!-- Main Wrapper -->
<div class="wrapper">
    <div class="container h-100 d-flex flex-column" style="min-height: 0;">
        <div class="row g-4 h-100">
            <!-- Left Column: Controls -->
            <div class="col-lg-5 col-xl-4 h-100" style="overflow-y: auto; overflow-x: hidden; padding-right: 8px;">
                
                <!-- Cloudflare Connection -->
                <div class="card">
                    <div class="card-header d-flex align-items-center gap-2">
                        <svg class="svg-icon" style="color: var(--accent-blue);" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Authentication
                    </div>
                    <div class="card-body">
                        <form id="tokenForm">
                            <label class="form-label">API Token</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="apiToken" placeholder="••••••••••••••••••••••••••" required>
                                <button class="btn" type="submit" aria-label="Unlock">
                                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Add Record -->
                <div class="card mb-2">
                    <div class="card-header d-flex align-items-center gap-2">
                        <svg class="svg-icon" style="color: var(--success-green);" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        New Target
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label">Zone</label>
                            <div class="input-group">
                                <select class="form-select" id="zoneSelect" disabled><option value="">Authenticate first...</option></select>
                                <button class="btn" type="button" id="fetchZonesBtn" disabled title="Refresh Zones">
                                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
                                </button>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">DNS Record (A)</label>
                            <div class="input-group">
                                <select class="form-select" id="recordSelect" disabled><option value="">Select a Zone first...</option></select>
                                <button class="btn" type="button" id="fetchRecordsBtn" disabled title="Refresh Records">
                                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="row mb-5 g-3">
                            <div class="col-12 col-md-4">
                                <label class="form-label">Proxy Status</label>
                                <select class="form-select" id="proxySelect" disabled>
                                    <option value="default">CF Default</option>
                                    <option value="true">Proxied</option>
                                    <option value="false">DNS Only</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-4">
                                <label class="form-label">Check (Min)</label>
                                <input type="number" class="form-control" id="intervalInput" min="1" value="1" disabled>
                            </div>
                            <div class="col-6 col-md-4">
                                <label class="form-label">TTL</label>
                                <select class="form-select" id="ttlSelect" disabled>
                                    <option value="1">Auto</option>
                                    <option value="60">1 Min</option>
                                    <option value="120">2 Mins</option>
                                    <option value="300">5 Mins</option>
                                    <option value="600">10 Mins</option>
                                    <option value="3600">1 Hour</option>
                                </select>
                            </div>
                        </div>

                        <button id="addRecordBtn" class="btn btn-primary w-100" disabled>Start Tracking</button>
                    </div>
                </div>
            </div>
            
            <!-- Middle Column: Targets -->
            <div class="col-lg-7 col-xl-8 d-flex flex-column gap-4 h-100" style="min-height: 0;">
                
                <!-- Tracked Records -->
                <div class="card flex-shrink-0 m-0">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="d-flex align-items-center gap-2">
                            <svg class="svg-icon" style="color: var(--accent-blue);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                            Active Targets
                        </span>
                    </div>
                    <div class="card-body p-0">
                        <div id="trackedDomainsList">
                            <p class="text-muted text-center my-4 py-4 fs-6">No targets configured.</p>
                        </div>
                    </div>
                </div>

                <!-- Logs -->
                <div class="card flex-grow-1 border-0 shadow-none bg-transparent m-0 d-flex flex-column overflow-hidden" style="min-height: 0;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-medium text-main d-flex align-items-center gap-2">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
                            System Logs
                        </span>
                        <button class="btn btn-icon-only" id="clearLogsBtn" title="Clear Logs">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                    <div class="log-container" id="logViewer"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container d-flex justify-content-center align-items-center gap-2">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        Cloudflare DDNS • Minimal Edition
    </div>
</footer>

<script>
    let currentConfig = { token: '', domains: [] };
    let currentDomainStatus = {};

    function getRelativeTime(ms) {
        if (!ms) return 'Never';
        const diffInSeconds = Math.floor((Date.now() - ms) / 1000);
        if (diffInSeconds < 60) return 'Just now';
        const diffInMinutes = Math.floor(diffInSeconds / 60);
        if (diffInMinutes < 60) return `${diffInMinutes}m ago`;
        const diffInHours = Math.floor(diffInMinutes / 60);
        if (diffInHours < 24) return `${diffInHours}h ago`;
        return `${Math.floor(diffInHours / 24)}d ago`;
    }

    function formatTTL(ttl) {
        if (!ttl || ttl == 1) return 'Auto';
        if (ttl < 60) return `${ttl}s`;
        if (ttl < 3600) return `${Math.floor(ttl/60)}m`;
        return `${Math.floor(ttl/3600)}h`;
    }

    // SVGs for Icons
    const ICONS = {
        sun: '<path d="M12 3v1"/><path d="M12 20v1"/><path d="M3 12h1"/><path d="M20 12h1"/><path d="m18.364 5.636-.707.707"/><path d="m6.343 17.657-.707.707"/><path d="m5.636 5.636.707.707"/><path d="m17.657 17.657.707.707"/><circle cx="12" cy="12" r="4"/>',
        moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
        play: '<polygon points="5 3 19 12 5 21 5 3"/>',
        pause: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
        sync: '<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/>',
        trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
        checkCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
        alertCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
        clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'
    };

    // Dark mode toggle
    const darkModeBtn = document.getElementById('darkModeBtn');
    const themeIcon = document.getElementById('themeIcon');
    let isDark = localStorage.getItem('theme') !== 'light'; // Default dark
    
    function updateThemeIcon() {
        themeIcon.innerHTML = isDark ? ICONS.sun : ICONS.moon;
        if (isDark) {
            document.body.classList.add('dark-mode');
        } else {
            document.body.classList.remove('dark-mode');
        }
    }
    
    updateThemeIcon();
    
    darkModeBtn.addEventListener('click', () => {
        isDark = !isDark;
        updateThemeIcon();
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    async function loadConfig() {
        try {
            const res = await fetch('/api/config');
            currentConfig = await res.json();
            document.getElementById('apiToken').value = currentConfig.token || '';
            renderTrackedDomains();

            if (currentConfig.token) {
                enableZoneFetching();
                loadZones();
            }
        } catch(e) {}
    }

    function renderTrackedDomains() {
        const list = document.getElementById('trackedDomainsList');
        if (!currentConfig.domains || currentConfig.domains.length === 0) {
            list.innerHTML = '<p class="text-muted text-center my-4 py-4 fs-6">No targets configured.</p>';
            return;
        }

        list.innerHTML = currentConfig.domains.map((d, index) => {
            const status = currentDomainStatus[d.DNS_RECORD_ID] || {};
            const isOk = status.status === 'ok';
            const isError = status.status === 'error';
            const isWarning = status.status === 'warning';
            
            let statusColor = '#94a3b8'; // default slate-400
            if (isOk) statusColor = 'var(--success-green)';
            if (isError) statusColor = 'var(--danger-red)';
            if (isWarning) statusColor = '#f59e0b';
            if (d.PAUSED) statusColor = '#64748b';

            return `
            <div class="domain-item ${d.PAUSED ? 'paused' : ''}">
                <div>
                    <div class="fw-medium text-main mb-1 d-flex align-items-center gap-2" style="font-size: 0.95rem;">
                        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background-color:${statusColor}; box-shadow:0 0 6px ${statusColor}80;" title="${status.message || 'Pending check...'}"></span>
                        ${d.DNS_RECORD_NAME} 
                        ${status.ip ? `<span class="text-muted" style="font-size:0.75rem; font-weight:400; font-family:'JetBrains Mono', monospace;">${status.ip}</span>` : ''}
                    </div>
                    <div class="domain-meta">
                        ${d.PROXIED ? '<span class="badge badge-proxy-on">PROXIED</span>' : '<span class="badge badge-proxy-off">DNS ONLY</span>'}
                        <span class="badge badge-interval">${d.UPDATE_INTERVAL || 1}M CHECK</span>
                        <span class="badge" style="background-color:rgba(148,163,184,0.1); color:var(--text-muted);">${formatTTL(d.TTL)} TTL</span>
                        ${d.PAUSED ? '<span class="badge badge-paused">PAUSED</span>' : ''}
                    </div>
                    <div class="d-flex gap-3 mt-2" style="font-size: 0.7rem; color: var(--text-muted);">
                        <div class="d-flex align-items-center gap-1">
                            <svg class="svg-icon" style="width:12px; height:12px;" viewBox="0 0 24 24">${ICONS.clock}</svg>
                            Checked: <span>${getRelativeTime(status.lastChecked)}</span>
                        </div>
                        <div class="d-flex align-items-center gap-1">
                            <svg class="svg-icon" style="width:12px; height:12px; color: ${isOk ? 'var(--success-green)' : 'currentColor'};" viewBox="0 0 24 24">${ICONS.checkCircle}</svg>
                            Updated: <span>${getRelativeTime(status.lastUpdated)}</span>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-1" style="align-items: flex-start; justify-content: flex-end; flex-shrink: 0; padding-top: 4px;">
                    <button class="btn btn-icon-only" title="Force Sync" onclick="forceSync(${index})">
                        <svg class="svg-icon" viewBox="0 0 24 24">${ICONS.sync}</svg>
                    </button>
                    <button class="btn btn-icon-only" title="${d.PAUSED ? 'Resume' : 'Pause'}" onclick="togglePause(${index})">
                        <svg class="svg-icon" viewBox="0 0 24 24">${d.PAUSED ? ICONS.play : ICONS.pause}</svg>
                    </button>
                    <button class="btn btn-icon-only text-danger" title="Delete" onclick="removeDomain(${index})">
                        <svg class="svg-icon" viewBox="0 0 24 24">${ICONS.trash}</svg>
                    </button>
                </div>
            </div>
        `}).join('');
    }

    async function forceSync(index) {
        if (!confirm('Force an immediate IP sync to Cloudflare?')) return;
        try {
            const res = await fetch(`/api/domains/${index}/sync`, { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                // Silently succeed, logs will show it
            } else {
                alert('Failed to sync: ' + data.error);
            }
            fetchLogs();
        } catch (e) {
            // Error
        }
    }

    async function togglePause(index) {
        await fetch(`/api/domains/${index}/toggle`, { method: 'POST' });
        await loadConfig();
    }

    async function removeDomain(index) {
        if (!confirm('Delete this target?')) return;
        await fetch(`/api/domains/${index}`, { method: 'DELETE' });
        await loadConfig();
    }

    document.getElementById('tokenForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = document.getElementById('apiToken').value;
        const res = await fetch('/api/config/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
        });
        if (res.ok) {
            currentConfig.token = token;
            enableZoneFetching();
            loadZones();
        }
    });

    function enableZoneFetching() {
        document.getElementById('fetchZonesBtn').disabled = false;
        document.getElementById('zoneSelect').disabled = false;
    }

    async function loadZones() {
        const select = document.getElementById('zoneSelect');
        select.innerHTML = '<option value="">Loading...</option>';
        try {
            const res = await fetch('/api/cf/zones');
            const data = await res.json();
            if (data.success) {
                select.innerHTML = '<option value="">-- Select a Zone --</option>' + 
                    data.result.map(z => `<option value="${z.id}">${z.name}</option>`).join('');
            } else {
                select.innerHTML = `<option value="">Error: ${data.errors?.[0]?.message || 'Unknown'}</option>`;
            }
        } catch (e) {
            select.innerHTML = `<option value="">Fetch error</option>`;
        }
    }

    document.getElementById('fetchZonesBtn').addEventListener('click', loadZones);

    document.getElementById('zoneSelect').addEventListener('change', async (e) => {
        const zoneId = e.target.value;
        const recordBtn = document.getElementById('fetchRecordsBtn');
        const recordSelect = document.getElementById('recordSelect');
        
        if (!zoneId) {
            recordBtn.disabled = true;
            recordSelect.disabled = true;
            recordSelect.innerHTML = '<option value="">Select a Zone first...</option>';
            document.getElementById('addRecordBtn').disabled = true;
            document.getElementById('proxySelect').disabled = true;
            document.getElementById('intervalInput').disabled = true;
            document.getElementById('ttlSelect').disabled = true;
            return;
        }

        recordBtn.disabled = false;
        recordSelect.disabled = false;
        loadRecords(zoneId);
    });

    async function loadRecords(zoneId) {
        const select = document.getElementById('recordSelect');
        select.innerHTML = '<option value="">Loading...</option>';
        try {
            const res = await fetch(`/api/cf/zones/${zoneId}/dns_records`);
            const data = await res.json();
            if (data.success) {
                if (data.result.length === 0) {
                    select.innerHTML = '<option value="">No A records found</option>';
                    document.getElementById('addRecordBtn').disabled = true;
                    document.getElementById('proxySelect').disabled = true;
                    document.getElementById('intervalInput').disabled = true;
                    document.getElementById('ttlSelect').disabled = true;
                    return;
                }
                select.innerHTML = '<option value="">-- Select a Record --</option>' + 
                    data.result.map(r => {
                        const val = JSON.stringify({id: r.id, name: r.name, proxied: r.proxied, ttl: r.ttl}).replace(/'/g, "&#39;");
                        return `<option value='${val}'>${r.name} (${r.content})</option>`;
                    }).join('');
                document.getElementById('addRecordBtn').disabled = false;
                document.getElementById('proxySelect').disabled = false;
                document.getElementById('intervalInput').disabled = false;
                document.getElementById('ttlSelect').disabled = false;
            } else {
                select.innerHTML = `<option value="">Error fetching</option>`;
                document.getElementById('addRecordBtn').disabled = true;
                document.getElementById('proxySelect').disabled = true;
                document.getElementById('intervalInput').disabled = true;
                document.getElementById('ttlSelect').disabled = true;
            }
        } catch (e) {
            select.innerHTML = `<option value="">Fetch error</option>`;
            document.getElementById('addRecordBtn').disabled = true;
            document.getElementById('proxySelect').disabled = true;
            document.getElementById('intervalInput').disabled = true;
            document.getElementById('ttlSelect').disabled = true;
        }
    }

    document.getElementById('fetchRecordsBtn').addEventListener('click', () => {
        const zoneId = document.getElementById('zoneSelect').value;
        if (zoneId) loadRecords(zoneId);
    });

    document.getElementById('addRecordBtn').addEventListener('click', async () => {
        const zoneId = document.getElementById('zoneSelect').value;
        const recordVal = document.getElementById('recordSelect').value;
        const proxyOverride = document.getElementById('proxySelect').value;
        const interval = parseInt(document.getElementById('intervalInput').value) || 1;
        const ttl = parseInt(document.getElementById('ttlSelect').value) || 1;
        
        if (!zoneId || !recordVal) {
            alert('Please select both a Zone and a Record');
            return;
        }

        const recordInfo = JSON.parse(recordVal);
        let finalProxy = recordInfo.proxied;
        if (proxyOverride === 'true') finalProxy = true;
        if (proxyOverride === 'false') finalProxy = false;
        
        const payload = {
            ZONE_ID: zoneId,
            DNS_RECORD_ID: recordInfo.id,
            DNS_RECORD_NAME: recordInfo.name,
            PROXIED: finalProxy,
            UPDATE_INTERVAL: interval,
            TTL: ttl,
            PAUSED: false
        };

        const res = await fetch('/api/domains', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            document.getElementById('zoneSelect').value = "";
            document.getElementById('recordSelect').innerHTML = '<option value="">Select a Zone first...</option>';
            document.getElementById('recordSelect').disabled = true;
            document.getElementById('addRecordBtn').disabled = true;
            document.getElementById('proxySelect').disabled = true;
            document.getElementById('intervalInput').disabled = true;
            document.getElementById('ttlSelect').disabled = true;
            loadConfig();
        }
    });

    document.getElementById('clearLogsBtn').addEventListener('click', async () => {
        if (confirm("Clear all logs permanently?")) {
            await fetch('/api/logs', { method: 'DELETE' });
            fetchLogs();
        }
    });

    document.getElementById('restartBtn').addEventListener('click', async () => {
        if (confirm("Reboot the server instance?")) {
            await fetch('/api/restart', { method: 'POST' });
            setTimeout(() => { location.reload(); }, 3000);
        }
    });

    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            const data = await res.json();
            const logViewer = document.getElementById('logViewer');
            const atBottom = logViewer.scrollHeight - logViewer.scrollTop <= logViewer.clientHeight + 20;
            
            // Format logs as individual entries for better readability
            if (!data.logs || data.logs.trim() === '') {
                logViewer.innerHTML = '<span style="color: var(--text-muted); opacity: 0.7;">Awaiting system events...</span>';
                return;
            }

            const lines = data.logs.trim().split('\n');
            const formattedLogs = lines.map(line => {
                // Match regex for timestamp and log level: "YYYY-MM-DD HH:MM:SS - LEVEL - Message"
                const match = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\s+-\s+(.*?)\s+-\s+(.*)$/);
                if (match) {
                    const [, time, level, msg] = match;
                    let parsedLevel = level.trim();
                    let parsedMsg = msg;
                    
                    let levelColor = 'var(--text-main)';
                    let msgColor = 'var(--text-muted)';

                    if (parsedLevel === 'INFO') levelColor = 'var(--accent-blue)';
                    if (parsedLevel === 'WARNING') { levelColor = '#f59e0b'; msgColor = '#fbbf24'; }
                    if (parsedLevel === 'ERROR') { levelColor = 'var(--danger-red)'; msgColor = '#f87171'; }

                    // Upgrade INFO to SUCCESS visually if message contains 'Success:'
                    if (parsedMsg.includes('Success:')) {
                        levelColor = 'var(--success-green)';
                        msgColor = '#34d399';
                        parsedLevel = 'SUCCESS';
                        parsedMsg = parsedMsg.replace('Success: ', '');
                    }

                    return `<div class="log-entry"><span class="log-time">${time}</span><span style="color: ${levelColor}; font-weight: 600; margin-right: 8px; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); letter-spacing: 0.05em;">${parsedLevel}</span> <span style="color: ${msgColor};">${parsedMsg}</span></div>`;
                }
                
                // Fallback for unstructured lines
                let lineStr = line
                    .replace(/(INFO)/g, '<span style="color: var(--accent-blue); font-weight: 500;">$1</span>')
                    .replace(/(WARNING)/g, '<span style="color: #f59e0b; font-weight: 500;">$1</span>')
                    .replace(/(ERROR)/g, '<span style="color: var(--danger-red); font-weight: 500;">$1</span>')
                    .replace(/([0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2})/g, '<span class="log-time">$1</span>');
                    
                if (line.includes('Success:')) {
                    lineStr = `<span style="color: #34d399;">${lineStr}</span>`;
                }

                return `<div class="log-entry">${lineStr}</div>`;
            }).join('');
                
            logViewer.innerHTML = formattedLogs;
            
            if (atBottom) {
                logViewer.scrollTop = logViewer.scrollHeight;
            }
        } catch (err) {}
    }
    
    async function fetchStatus() {
        try {
            const res = await fetch('/api/status');
            currentDomainStatus = await res.json();
            renderTrackedDomains(); // Update timestamps and colors dynamically
        } catch (err) {}
    }

    loadConfig();
    fetchLogs();
    fetchStatus();
    setInterval(() => {
        fetchLogs();
        fetchStatus();
    }, 3000);
</script>
